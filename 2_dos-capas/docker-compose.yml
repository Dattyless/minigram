
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=bbdd
      - DB_PORT=5432
      - DB_NAME=monolito
      - DB_USER=usuario
      - DB_PASSWORD=123456
    networks:
      - dos_capas_network
    depends_on:
      - bbdd

  bbdd:
    image: postgres:18.6-alpine3.24
    container_name: bbdd
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: monolito
    volumes:
      - ./bbdd/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - dos_capas_network

networks:
  dos_capas_network:
    driver: bridge
