services:

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:4200"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=bbdd
      - DB_PORT=5432
      - DB_NAME=monolito
      - DB_USER=usuario
      - DB_PASSWORD=123456
    # Monto la carpeta uploads del host dentro del contenedor.
    # Sin esto, las imágenes se quedaban dentro del contenedor y se perdían
    # cada vez que lo reconstruía con "docker compose up --build".
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - dos_capas_network
    depends_on:
      - bbdd

  bbdd:
    image: postgres:18.6-alpine3.24
    container_name: bbdd
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: monolito
    volumes:
      # Los scripts se ejecutan en orden alfabético al crear la base de datos.
      - ./bbdd/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./bbdd/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - dos_capas_network

networks:
  dos_capas_network:
    driver: bridge