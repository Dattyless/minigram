<section class="login">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Iniciar sesión</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <form class="login-form" (submit)="submit($event)">
        <mat-form-field>
          <mat-label>Usuario</mat-label>
          <input matInput autocomplete="username" [formField]="loginForm.username" />
          @for (error of loginForm.username().errors(); track error) {
            <mat-error>{{ error.message }}</mat-error>
          }
        </mat-form-field>

        <mat-form-field>
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            autocomplete="current-password"
            [type]="hide() ? 'password' : 'text'"
            [formField]="loginForm.password"
            (input)="updatePassword($event)"
          />
          <button
            matIconButton
            matSuffix
            type="button"
            (click)="clickEvent($event)"
            [attr.aria-label]="hide() ? 'Mostrar contraseña' : 'Ocultar contraseña'"
            [attr.aria-pressed]="hide()"
          >
            <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          @for (error of loginForm.password().errors(); track error) {
            <mat-error>{{ error.message }}</mat-error>
          }
        </mat-form-field>

        @if (errorMessage()) {
          <p class="login-error" role="alert">{{ errorMessage() }}</p>
        }

        <button matButton="filled" type="submit" [disabled]="loading()">
          {{ loading() ? 'Entrando...' : 'Entrar' }}
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</section>
